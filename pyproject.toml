[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honey-agent-lab"
version = "0.3.0"
description = "Defensive simulation lab for detecting agent-to-agent compromise and unauthorized coordination."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ales27pm"}]
keywords = ["agent-security", "defensive-ai", "simulation", "audit", "quarantine"]
dependencies = []

[project.scripts]
honey-agent-lab = "honey_agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
honey_agent_lab = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
